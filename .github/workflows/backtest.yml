name: Lotto Backtest
on:
  push:
    paths:
      - 'backtest.py'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run walk-forward backtest
        run: python backtest.py
      - name: Commit result
        run: |
          git config user.name "lotto-backtest-bot"
          git config user.email "lotto-backtest-bot@users.noreply.github.com"
          git add backtest-result.json
          git diff --cached --quiet || git commit -m "Update lotto backtest result"
          git push

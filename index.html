<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>로또 6/45 분석 추천</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f4f6f8;color:#111827}.wrap{max-width:720px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 20px #0000000d}.hero h1{margin:0;font-size:28px}.hero p,.muted{color:#6b7280}.status{display:flex;justify-content:space-between;align-items:center;gap:12px}.small{font-size:13px;color:#6b7280}button{width:100%;border:0;border-radius:14px;padding:15px 16px;background:#111827;color:#fff;font-weight:800;font-size:17px}button.secondary{background:#eef2f7;color:#111827;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.ball{width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;border:1px solid #00000012}.b1{background:#f8d24a}.b2{background:#5db6e8}.b3{background:#f26b6b}.b4{background:#9a9a9a;color:#fff}.b5{background:#69bd7b}.game{padding:14px 0;border-bottom:1px solid #e5e7eb}.game:last-child{border-bottom:0}.gametop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.tag,.pill{background:#eef2f7;border-radius:20px;padding:5px 9px;font-size:12px;color:#4b5563}.pill{display:inline-block;margin:3px;font-size:14px;font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:14px;padding:12px}.metric b{display:block;font-size:19px;margin-top:4px}.warn{font-size:12px;color:#6b7280;line-height:1.5;margin-top:12px}.good{color:#16a34a;font-weight:700}.error{color:#dc2626;font-weight:700}footer{text-align:center;color:#6b7280;font-size:12px;margin-top:24px}</style></head><body><div class="wrap"><section class="hero"><h1>로또 6/45 분석 추천</h1><p>역대 당첨 데이터를 바탕으로 최근 빈도·미출현·조합 분포를 함께 분석합니다.</p></section><section class="card"><div class="status"><div><div class="small">데이터 상태</div><div id="status"><b>불러오는 중…</b></div></div><div class="small" id="latest"></div></div></section><section class="card"><button id="recommendBtn" disabled>이번 주 추천번호 5게임</button><button class="secondary" id="refreshBtn">최신 데이터 새로고침</button><div class="warn">※ 과거 통계 기반 참고용입니다. 모든 6개 조합의 1등 확률은 동일합니다.</div></section><section class="card" id="recCard" style="display:none"><h2 style="margin-top:0">추천 조합</h2><div id="games"></div></section><section class="card" id="statsCard" style="display:none"><h2 style="margin-top:0">이번 주 분석</h2><div class="grid2"><div class="metric"><span class="small">최근 50회 HOT</span><b id="hotCount">-</b></div><div class="metric"><span class="small">장기 미출현</span><b id="coldCount">-</b></div></div><h3>유력 후보</h3><div id="hotNums"></div><h3>장기 미출현 후보</h3><div id="coldNums"></div></section><footer>실제 구매 전 공식 당첨번호 확인 권장</footer></div><script>const DATA_URL='https://smok95.github.io/lotto/results/all.json';let draws=[];function ballClass(n){if(n<=10)return'b1';if(n<=20)return'b2';if(n<=30)return'b3';if(n<=40)return'b4';return'b5'}function ball(n){return`<span class="ball ${ballClass(n)}">${n}</span>`}function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}function norm(o){return{draw_no:+o.draw_no,numbers:o.numbers.map(Number).sort((a,b)=>a-b)}}function normalizeMap(m){const v=Object.values(m),lo=Math.min(...v),hi=Math.max(...v),out={};for(const k in m)out[k]=hi===lo?.5:(m[k]-lo)/(hi-lo);return out}function percentile(arr,p){const a=[...arr].sort((x,y)=>x-y),i=(a.length-1)*p,l=Math.floor(i),h=Math.ceil(i);return l===h?a[l]:a[l]*(h-i)+a[h]*(i-l)}function analyze(){const latest=draws.at(-1).draw_no,all={},r20={},r50={},last={};for(let n=1;n<=45;n++){all[n]=0;r20[n]=0;r50[n]=0;last[n]=0}draws.forEach(d=>d.numbers.forEach(n=>{all[n]++;last[n]=d.draw_no}));draws.slice(-20).forEach(d=>d.numbers.forEach(n=>r20[n]++));draws.slice(-50).forEach(d=>d.numbers.forEach(n=>r50[n]++));const gap={};for(let n=1;n<=45;n++)gap[n]=latest-last[n];const A=normalizeMap(all),B=normalizeMap(r20),C=normalizeMap(r50),G=normalizeMap(gap),score={};for(let n=1;n<=45;n++)score[n]=.2*A[n]+.25*B[n]+.3*C[n]+.25*G[n];const sums=draws.map(d=>d.numbers.reduce((a,b)=>a+b,0));return{latest,r50,gap,score,p10:percentile(sums,.1),p90:percentile(sums,.9),lastSet:new Set(draws.at(-1).numbers)}}function weightedPick(rng,score){let items=Array.from({length:45},(_,i)=>i+1),out=[];for(let k=0;k<6;k++){let ws=items.map(n=>.25+score[n]),total=ws.reduce((a,b)=>a+b,0),r=rng()*total,acc=0,idx=0;for(let i=0;i<items.length;i++){acc+=ws[i];if(acc>=r){idx=i;break}}out.push(items[idx]);items.splice(idx,1)}return out.sort((a,b)=>a-b)}function comboScore(ns,info){let odd=ns.filter(n=>n%2).length,low=ns.filter(n=>n<=22).length,sum=ns.reduce((a,b)=>a+b,0),con=0;for(let i=1;i<6;i++)if(ns[i]===ns[i-1]+1)con++;let dec=new Set(ns.map(n=>Math.floor((n-1)/10))).size,ov=ns.filter(n=>info.lastSet.has(n)).length,s=ns.reduce((a,n)=>a+info.score[n],0)/6*5;s+=(odd>=2&&odd<=4)?1:-.8;s+=(low>=2&&low<=4)?.8:-.6;s+=(sum>=info.p10&&sum<=info.p90)?1:-1;s+=con<=1?.5:-.7*con;s+=dec>=4?.6:-.5;s+=ov<=2?.4:-.6*(ov-2);return s}function recommend(){const info=analyze(),rng=mulberry32((info.latest+1)*1000003+645),pool=new Map();for(let i=0;i<35000;i++){const ns=weightedPick(rng,info.score),k=ns.join(',');if(!pool.has(k))pool.set(k,comboScore(ns,info))}const ranked=[...pool.entries()].sort((a,b)=>b[1]-a[1]);let chosen=[];for(const [k]of ranked){const ns=k.split(',').map(Number);if(chosen.every(c=>ns.filter(n=>c.includes(n)).length<=3))chosen.push(ns);if(chosen.length===5)break}render(chosen,info)}function render(chosen,info){recCard.style.display='block';statsCard.style.display='block';games.innerHTML=chosen.map((ns,i)=>{const odd=ns.filter(n=>n%2).length,sum=ns.reduce((a,b)=>a+b,0);return`<div class="game"><div class="gametop"><b>${i+1}게임</b><span class="tag">합 ${sum} · 홀짝 ${odd}:${6-odd}</span></div><div class="row">${ns.map(ball).join('')}</div></div>`}).join('');const hot=Object.entries(info.r50).sort((a,b)=>b[1]-a[1]).slice(0,10),cold=Object.entries(info.gap).sort((a,b)=>b[1]-a[1]).slice(0,10);hotNums.innerHTML=hot.map(([n,c])=>`<span class="pill">${n} · ${c}회</span>`).join('');coldNums.innerHTML=cold.map(([n,g])=>`<span class="pill">${n} · ${g}회 미출현</span>`).join('');hotCount.textContent=hot[0][0]+'번';coldCount.textContent=cold[0][0]+'번'}async function loadData(){status.innerHTML='<b>최신 데이터 불러오는 중…</b>';recommendBtn.disabled=true;try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();draws=data.map(norm).sort((a,b)=>a.draw_no-b.draw_no);localStorage.setItem('lotto_draws',JSON.stringify(draws));status.innerHTML='<span class="good">● 연결 완료</span>'}catch(e){const saved=localStorage.getItem('lotto_draws');if(saved){draws=JSON.parse(saved);status.innerHTML='<b>저장 데이터 사용 중</b>'}else{status.innerHTML='<span class="error">데이터 연결 실패</span>';return}}latest.textContent=`${draws.at(-1).draw_no}회까지`;recommendBtn.disabled=false}recommendBtn.onclick=recommend;refreshBtn.onclick=loadData;loadData();</script></body></html>

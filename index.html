<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2032"><title>로또 6/45 회차 예상 시뮬레이션</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:radial-gradient(circle at top,#1a557f,#0b1f31 45%,#050c14);color:#f4fbff}.wrap{max-width:820px;margin:auto;padding:16px 14px 40px}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}h1{margin:0;font-size:27px}.sub{margin:8px 0 14px;color:#b6d1e3;line-height:1.5}.roundbox{display:flex;gap:8px;flex-wrap:wrap}.round,.date,.live{padding:8px 12px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff26;font-weight:900;font-size:14px}.live.on{background:linear-gradient(#29d4ff,#0b9ee5)}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}button{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;color:#fff;background:linear-gradient(#39d5ff,#109ee2);box-shadow:0 7px 18px #0005}.alt{background:linear-gradient(#405d75,#21384c)}.dark{background:linear-gradient(#334451,#202a32)}.stage{background:linear-gradient(#196c9c,#114663 52%,#0d3048);border:2px solid #ffffff22;border-radius:22px;padding:12px;box-shadow:0 14px 30px #0006}.panel{position:relative;overflow:hidden;border:2px solid #ffffff25;border-radius:18px;background:linear-gradient(#ffffff17,#ffffff08);min-height:390px}.tag{position:absolute;left:12px;top:10px;z-index:2;padding:6px 10px;border-radius:999px;background:#0005;border:1px solid #ffffff2d;font-size:13px;font-weight:900}canvas{width:100%;height:100%;display:block}.games{margin-top:12px;display:grid;gap:10px}.game{background:#ffffff12;border:1px solid #ffffff20;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;opacity:0;transform:translateY(8px);animation:show .35s forwards}@keyframes show{to{opacity:1;transform:none}}.glabel{min-width:58px;font-size:14px;font-weight:900;color:#d9efff}.nums{display:flex;gap:7px;flex-wrap:wrap}.ball{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;box-shadow:0 5px 12px #0004}.b1{background:#f7cb45;color:#111}.b2{background:#55b8ff;color:#111}.b3{background:#ff7070;color:#111}.b4{background:#566678;color:#fff}.b5{background:#69ca7e;color:#111}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.card,.log{background:#ffffff12;border:1px solid #ffffff1f;border-radius:16px;padding:14px}.label{color:#b3ccdd;font-size:13px}.value{font-size:21px;font-weight:900;margin-top:5px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{background:#ffffff12;border-radius:999px;padding:5px 9px;font-size:12px}.log{margin-top:14px;line-height:1.6;min-height:74px}.note{margin-top:10px;color:#b8cfdf;font-size:12px;line-height:1.5}@media(max-width:700px){.controls,.cards{grid-template-columns:1fr}.panel{min-height:320px}.ball{width:42px;height:42px;font-size:18px}}
</style></head><body><div class="wrap"><div class="head"><div><h1>로또 6/45 회차 예상 시뮬레이션</h1><div class="sub">이번 주 예상 회차에 맞춰 <b>시작 한 번으로 랜덤 5게임</b>을 생성합니다.</div></div><div class="roundbox"><div class="round" id="round">제 ?회차 예상</div><div class="date" id="drawDate">추첨일 계산 중</div><div class="live" id="live">대기 중</div></div></div><div class="controls"><button id="random">랜덤 5게임 추첨</button><button id="stat" class="alt">통계 추천 5게임</button><button id="reset" class="dark">다시 준비</button></div><div class="stage"><div class="panel"><div class="tag" id="machineTag">제 ?회차 예상 추첨기</div><canvas id="machine" width="1000" height="560"></canvas></div><div class="games" id="games"></div></div><div class="cards"><div class="card"><div class="label">현재 모드</div><div class="value" id="mode">대기 중</div><div class="pills"><span class="pill">한 번에 5게임</span><span class="pill">게임당 6개 번호</span><span class="pill">주간 회차 자동 계산</span></div></div><div class="card"><div class="label">데이터 상태</div><div class="value" id="data">불러오는 중…</div><div class="pills" id="meta"></div></div></div><div class="log" id="log">버튼을 누르면 추첨기가 돌고 5게임이 순서대로 표시됩니다.</div><div class="note">※ 랜덤 5게임은 1~45를 동일 확률로 뽑습니다. 통계 추천 5게임은 과거 빈도·최근 출현·미출현 가중치를 참고한 시뮬레이션입니다.</div></div><script>
const URL='https://smok95.github.io/lotto/results/all.json',ctx=machine.getContext('2d');let D=[],B=[],targetRound='?',targetDate=null,running=false;const C=n=>n<=10?'#f7cb45':n<=20?'#55b8ff':n<=30?'#ff7070':n<=40?'#566678':'#69ca7e',TC=n=>n>=31&&n<=40?'#fff':'#111',R=(a,b)=>Math.random()*(b-a)+a;function cls(n){return n<=10?'b1':n<=20?'b2':n<=30?'b3':n<=40?'b4':'b5'}function logm(x){log.innerHTML=x}function liveSet(x,on=0){live.textContent=x;live.className='live'+(on?' on':'')}function parseDate(s){if(!s)return null;let d=new Date(s+'T00:00:00+09:00');return isNaN(d)?null:d}function nextSaturday(from=new Date()){let d=new Date(from);d.setHours(0,0,0,0);let add=(6-d.getDay()+7)%7;if(add===0&&from.getHours()>=21)add=7;d.setDate(d.getDate()+add);return d}function fmtDate(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} 토`}function calcTarget(latest){let ld=parseDate(latest.date),now=new Date(),inc=1,td;if(ld){let days=Math.max(0,Math.floor((now-ld)/86400000));inc=Math.max(1,Math.floor(days/7)+1);td=new Date(ld);td.setDate(td.getDate()+7*inc)}else td=nextSaturday(now);targetRound=latest.no+inc;targetDate=td;round.textContent=`제 ${targetRound}회차 예상`;drawDate.textContent=`${fmtDate(td)} 추첨 예정`;machineTag.textContent=`제 ${targetRound}회차 예상 추첨기`}async function load(){try{let r=await fetch(URL,{cache:'no-store'}),j=await r.json();D=j.map(d=>({no:+d.draw_no,n:d.numbers.map(Number).sort((a,b)=>a-b),date:d.date||d.drwNoDate||''})).sort((a,b)=>a.no-b.no);localStorage.lottoFive=JSON.stringify(D);calcTarget(D.at(-1));data.textContent='연결 완료';meta.innerHTML=`<span class="pill">최신 ${D.at(-1).no}회</span><span class="pill">예상 ${targetRound}회</span>`}catch(e){let x=localStorage.lottoFive;if(x){D=JSON.parse(x);calcTarget(D.at(-1));data.textContent='저장 데이터 사용'}else{data.textContent='랜덤만 가능';let d=nextSaturday();drawDate.textContent=`${fmtDate(d)} 추첨 예정`}}}function mm(o){let v=Object.values(o),lo=Math.min(...v),hi=Math.max(...v),r={};for(let k in o)r[k]=hi==lo?.5:(o[k]-lo)/(hi-lo);return r}function ana(){if(!D.length)return null;let latest=D.at(-1).no,a={},q={},f={},h={},last={};for(let n=1;n<=45;n++)a[n]=q[n]=f[n]=h[n]=last[n]=0;D.forEach(d=>d.n.forEach(n=>{a[n]++;last[n]=d.no}));D.slice(-20).forEach(d=>d.n.forEach(n=>q[n]++));D.slice(-50).forEach(d=>d.n.forEach(n=>f[n]++));D.slice(-100).forEach(d=>d.n.forEach(n=>h[n]++));let g={};for(let n=1;n<=45;n++)g[n]=latest-last[n];let A=mm(a),Q=mm(q),F=mm(f),H=mm(h),G=mm(g),score={};for(let n=1;n<=45;n++)score[n]=.12*A[n]+.18*Q[n]+.25*F[n]+.2*H[n]+.25*G[n];return{score}}function randomGame(){let a=Array.from({length:45},(_,i)=>i+1);for(let i=44;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,6).sort((a,b)=>a-b)}function statGame(){let I=ana();if(!I)return randomGame();let items=Array.from({length:45},(_,i)=>i+1),out=[];for(let k=0;k<6;k++){let w=items.map(n=>.25+I.score[n]),tot=w.reduce((a,b)=>a+b),r=Math.random()*tot,s=0,p=0;for(let i=0;i<items.length;i++){s+=w[i];if(s>=r){p=i;break}}out.push(items.splice(p,1)[0])}return out.sort((a,b)=>a-b)}function make(){B=[];for(let n=1;n<=45;n++)B.push({n,x:R(50,950),y:R(80,500),vx:R(-4.5,4.5),vy:R(-4.5,4.5),r:16})}function ball(c,x,y,n,z){c.save();c.fillStyle=C(n);c.shadowColor='#0006';c.shadowBlur=7;c.beginPath();c.arc(x,y,z,0,6.29);c.fill();c.shadowBlur=0;c.strokeStyle='#ffffff55';c.lineWidth=2;c.stroke();c.fillStyle=TC(n);c.font=`900 ${Math.round(z*.85)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(n,x,y+1);c.restore()}function draw(){ctx.clearRect(0,0,1000,560);let g=ctx.createRadialGradient(500,280,30,500,280,480);g.addColorStop(0,'#214b68');g.addColorStop(1,'#0b1e2d');ctx.fillStyle=g;ctx.fillRect(0,0,1000,560);ctx.strokeStyle='#ffffff44';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(500,285,325,220,0,0,6.29);ctx.stroke();for(let b of B)ball(ctx,b.x,b.y,b.n,b.r);ctx.fillStyle='#fff';ctx.font='900 28px sans-serif';ctx.fillText(`제 ${targetRound}회차 예상`,34,48);if(targetDate){ctx.font='700 20px sans-serif';ctx.fillStyle='#d9efff';ctx.fillText(`${fmtDate(targetDate)} 추첨 예정`,34,78)}}function animate(){if(!running)return;for(let b of B){b.x+=b.vx;b.y+=b.vy;b.vx+=R(-.25,.25);b.vy+=R(-.25,.25);let sp=Math.hypot(b.vx,b.vy);if(sp>6){b.vx=b.vx/sp*6;b.vy=b.vy/sp*6}if(b.x<b.r||b.x>1000-b.r)b.vx*=-1;if(b.y<b.r||b.y>560-b.r)b.vy*=-1}draw();requestAnimationFrame(animate)}function renderGame(nums,i){let d=document.createElement('div');d.className='game';d.style.animationDelay=`${i*.08}s`;d.innerHTML=`<div class="glabel">${i+1}게임</div><div class="nums">${nums.map(n=>`<span class="ball ${cls(n)}">${n}</span>`).join('')}</div>`;games.appendChild(d)}function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function start5(type){if(running)return;running=true;games.innerHTML='';make();mode.textContent=type==='stat'?'통계 추천 5게임':'랜덤 5게임';liveSet('추첨 중',1);logm('추첨기를 돌리는 중입니다…');animate();await wait(1500);for(let i=0;i<5;i++){let nums=type==='stat'?statGame():randomGame();renderGame(nums,i);logm(`${i+1}게임 생성 완료…`);await wait(420)}running=false;liveSet('추첨 완료');logm(`제 ${targetRound}회차 예상 5게임 생성 완료.`)}function resetAll(){running=false;games.innerHTML='';make();mode.textContent='대기 중';liveSet('대기 중');logm('버튼을 누르면 추첨기가 돌고 5게임이 순서대로 표시됩니다.');draw()}random.onclick=()=>start5('random');stat.onclick=()=>start5('stat');reset.onclick=resetAll;make();load();resetAll();
</script></body></html>

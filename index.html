<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2032"><title>로또 6/45 방송풍 추첨</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:radial-gradient(circle at top,#1a557f,#0b1f31 45%,#050c14);color:#f4fbff}.wrap{max-width:1000px;margin:auto;padding:16px 14px 40px}h1{margin:0;font-size:27px}.sub{margin:8px 0 14px;color:#b6d1e3;line-height:1.5}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.round,.live{padding:8px 12px;border-radius:999px;background:#ffffff15;border:1px solid #ffffff26;font-weight:900;font-size:14px}.live.on{background:linear-gradient(#29d4ff,#0b9ee5)}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}button{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:900;color:white;background:linear-gradient(#39d5ff,#109ee2);box-shadow:0 7px 18px #0005}.alt{background:linear-gradient(#405d75,#21384c)}.dark{background:linear-gradient(#334451,#202a32)}.stage{background:linear-gradient(#196c9c,#114663 52%,#0d3048);border:2px solid #ffffff22;border-radius:22px;padding:12px;box-shadow:0 14px 30px #0006}.top{display:grid;grid-template-columns:1.08fr .92fr;gap:12px}.panel,.tray{position:relative;overflow:hidden;border:2px solid #ffffff25;border-radius:18px;background:linear-gradient(#ffffff17,#ffffff08)}.panel{min-height:330px}.tray{min-height:285px;margin-top:12px;padding-top:40px}.tag{position:absolute;left:12px;top:10px;z-index:2;padding:6px 10px;border-radius:999px;background:#0005;border:1px solid #ffffff2d;font-size:13px;font-weight:900}canvas{width:100%;height:100%;display:block}.results{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:80px;padding:12px;border-radius:16px;background:linear-gradient(#20caff,#10a7e8)}.badge{background:white;color:#0d577f;padding:8px 12px;border-radius:999px;font-weight:900}.nums{display:flex;gap:8px;flex-wrap:wrap}.rb{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:white;color:#111;font-size:32px;font-weight:900;box-shadow:0 5px 14px #0004}.rb.bonus{background:#087fff;color:white;box-shadow:0 0 0 4px #ffffff44,0 5px 14px #0004}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.card,.log{background:#ffffff12;border:1px solid #ffffff1f;border-radius:16px;padding:14px}.label{color:#b3ccdd;font-size:13px}.value{font-size:21px;font-weight:900;margin-top:5px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.pill{background:#ffffff12;border-radius:999px;padding:5px 9px;font-size:12px}.log{margin-top:14px;line-height:1.6;min-height:80px}@media(max-width:780px){.controls,.top,.cards{grid-template-columns:1fr}.rb{width:50px;height:50px;font-size:28px}}</style></head><body><div class="wrap"><div class="head"><div><h1>로또 6/45 방송풍 추첨 시뮬레이터</h1><div class="sub">공이 빠르게 회전하다 배출구에서 잠깐 대기한 뒤 <b>한 개씩 레일로 나오는</b> 방송풍 추첨입니다.</div></div><div style="display:flex;gap:8px;align-items:flex-start"><div class="round" id="round">제 ? 회</div><div class="live" id="live">대기 중</div></div></div><div class="controls"><button id="random">랜덤 추첨 시작</button><button id="stat" class="alt">통계 추천 추첨</button><button id="reset" class="dark">다시 준비</button></div><div class="stage"><div class="top"><div class="panel"><div class="tag">전체 추첨기</div><canvas id="machine" width="900" height="560"></canvas></div><div class="panel"><div class="tag">배출구 확대</div><canvas id="zoom" width="700" height="560"></canvas></div></div><div class="tray"><div class="tag">배출 레일 · 당첨 결과</div><canvas id="rail" width="1400" height="470"></canvas></div><div class="results"><div class="badge" id="modeBadge">시뮬레이션</div><div class="nums" id="nums"></div></div></div><div class="cards"><div class="card"><div class="label">현재 모드</div><div class="value" id="mode">대기 중</div><div class="pills"><span class="pill">메인 6개 + 보너스 1개</span><span class="pill">배출 직전 대기 연출</span><span class="pill">방송풍 레일</span></div></div><div class="card"><div class="label">데이터 상태</div><div class="value" id="data">불러오는 중…</div><div class="pills" id="meta"></div></div></div><div class="log" id="log">버튼을 누르면 공이 섞인 뒤 번호가 하나씩 나옵니다.</div></div><script>const URL='https://smok95.github.io/lotto/results/all.json',mc=machine.getContext('2d'),zc=zoom.getContext('2d'),rc=rail.getContext('2d');let D=[],B=[],T=[],S=[],phase='idle',idx=0,start=0,last=0,susp=0,next='?';const C=n=>n<=10?'#f7cb45':n<=20?'#55b8ff':n<=30?'#ff7070':n<=40?'#566678':'#69ca7e',TC=n=>n>=31&&n<=40?'#fff':'#111',R=(a,b)=>Math.random()*(b-a)+a;function logm(x){log.innerHTML=x}function liveSet(x,on=0){live.textContent=x;live.className='live'+(on?' on':'')}async function load(){try{let r=await fetch(URL,{cache:'no-store'}),j=await r.json();D=j.map(d=>({no:+d.draw_no,n:d.numbers.map(Number).sort((a,b)=>a-b)})).sort((a,b)=>a.no-b.no);localStorage.lottoFinal=JSON.stringify(D);next=D.at(-1).no+1;round.textContent=`제 ${next}회`;data.textContent='연결 완료';meta.innerHTML=`<span class="pill">최신 ${D.at(-1).no}회</span><span class="pill">총 ${D.length}회차</span>`}catch(e){let x=localStorage.lottoFinal;if(x){D=JSON.parse(x);next=D.at(-1).no+1;round.textContent=`제 ${next}회`;data.textContent='저장 데이터 사용'}else data.textContent='랜덤만 가능'}}function mm(o){let v=Object.values(o),lo=Math.min(...v),hi=Math.max(...v),r={};for(let k in o)r[k]=hi==lo?.5:(o[k]-lo)/(hi-lo);return r}function ana(){if(!D.length)return null;let latest=D.at(-1).no,a={},q={},f={},h={},last={};for(let n=1;n<=45;n++)a[n]=q[n]=f[n]=h[n]=last[n]=0;D.forEach(d=>d.n.forEach(n=>{a[n]++;last[n]=d.no}));D.slice(-20).forEach(d=>d.n.forEach(n=>q[n]++));D.slice(-50).forEach(d=>d.n.forEach(n=>f[n]++));D.slice(-100).forEach(d=>d.n.forEach(n=>h[n]++));let g={};for(let n=1;n<=45;n++)g[n]=latest-last[n];let A=mm(a),Q=mm(q),F=mm(f),H=mm(h),G=mm(g),score={};for(let n=1;n<=45;n++)score[n]=.12*A[n]+.18*Q[n]+.25*F[n]+.2*H[n]+.25*G[n];return{latest,score}}function randSet(){let a=Array.from({length:45},(_,i)=>i+1);for(let i=44;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return [...a.slice(0,6).sort((a,b)=>a-b),a[6]]}function statSet(){let I=ana();if(!I)return randSet();let items=Array.from({length:45},(_,i)=>i+1),out=[];for(let k=0;k<6;k++){let w=items.map(n=>.25+I.score[n]),tot=w.reduce((a,b)=>a+b),r=Math.random()*tot,s=0,p=0;for(let i=0;i<items.length;i++){s+=w[i];if(s>=r){p=i;break}}out.push(items.splice(p,1)[0])}out.sort((a,b)=>a-b);let rem=Array.from({length:45},(_,i)=>i+1).filter(n=>!out.includes(n));return [...out,rem[Math.floor(Math.random()*rem.length)]]}function make(){B=[];for(let n=1;n<=45;n++)B.push({n,a:R(0,6.28),o:R(20,138),v:R(.007,.021),st:'mix',t:0})}function ball(c,x,y,n,z,bonus=0,glow=0){c.save();c.shadowColor=glow?(bonus?'#168cffaa':'#ffffff88'):'#0005';c.shadowBlur=glow?18:7;c.fillStyle=bonus?'#087fff':C(n);c.beginPath();c.arc(x,y,z,0,6.29);c.fill();c.shadowBlur=0;c.strokeStyle='#ffffff55';c.lineWidth=2;c.stroke();c.fillStyle=bonus?'#fff':TC(n);c.font=`900 ${Math.round(z*.94)}px sans-serif`;c.textAlign='center';c.textBaseline='middle';c.fillText(n,x,y+1);c.restore()}function render(){nums.innerHTML='';S.forEach((n,i)=>{let d=document.createElement('div');d.className='rb'+(i==6?' bonus':'');d.textContent=n;nums.appendChild(d)})}function resetAll(){S=[];T=[];idx=0;phase='idle';make();mode.textContent='대기 중';modeBadge.textContent='시뮬레이션';liveSet('대기 중');render();logm('버튼을 누르면 공이 섞인 뒤 번호가 하나씩 나옵니다.')}function begin(m){T=m=='stat'?statSet():randSet();S=[];idx=0;phase='mix';start=performance.now();make();mode.textContent=m=='stat'?'통계 추천 추첨':'완전 랜덤 추첨';modeBadge.textContent=m=='stat'?'통계 추첨':'랜덤 추첨';liveSet('추첨 중',1);render();logm('공을 강하게 섞는 중입니다…')}function suspense(){phase='susp';susp=performance.now();logm(idx==6?'보너스 공이 배출구에 도달했습니다…':'공이 배출구로 올라왔습니다…')}function extract(){if(idx>=7)return;let n=T[idx],b=B.find(x=>x.n==n&&x.st=='mix');if(!b)return;b.st='out';b.t=0;phase='draw';last=performance.now();logm(idx==6?'보너스 번호를 추첨 중입니다…':`${idx+1}번째 번호를 추첨 중입니다…`)}function path(t){let a=1-t;return{x:a*a*a*250+3*a*a*t*340+3*a*t*t*590+t*t*t*700,y:a*a*a*150+3*a*a*t*48+3*a*t*t*195+t*t*t*228}}function loop(t){if(phase=='mix'&&t-start>2400)suspense();if(phase=='susp'&&t-susp>850)extract();if(phase=='draw'&&!B.find(b=>b.st=='out')&&idx<7&&t-last>1250)suspense();for(let b of B)if(b.st=='mix')b.a+=b.v*(phase=='mix'?3.2:phase=='susp'?1.2:1.9);else if(b.st=='out'){b.t+=.028;if(b.t>=1){b.st='done';S.push(b.n);render();idx++;last=t;if(S.length==7){phase='done';liveSet('추첨 완료');logm(`추첨 완료.<br>메인 번호: <b>${S.slice(0,6).join(', ')}</b><br>보너스 번호: <b>${S[6]}</b>`)}else logm(S.length==6?'보너스 번호를 추첨합니다.':`${S.length}번째 번호가 나왔습니다.`)}}drawM();drawZ(t);drawR();requestAnimationFrame(loop)}function drawM(){let c=mc,w=900,h=560;c.clearRect(0,0,w,h);let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#ffffff22');g.addColorStop(1,'#ffffff08');c.fillStyle=g;c.fillRect(0,0,w,h);let x=255,y=255,r=155;c.strokeStyle='#ffffff55';c.lineWidth=5;c.beginPath();c.arc(x,y,r,0,6.29);c.stroke();c.fillStyle='#ffffff0a';c.fill();c.strokeStyle='#e6f7ffee';c.lineWidth=12;c.beginPath();c.moveTo(390,320);c.bezierCurveTo(480,284,560,292,700,332);c.stroke();c.save();c.beginPath();c.arc(x,y,r-6,0,6.29);c.clip();for(let b of B)if(b.st=='mix')ball(c,x+Math.cos(b.a)*b.o*.92,y+Math.sin(b.a*1.16)*b.o*.62+Math.sin(b.a*2.8)*7,b.n,17);c.restore();for(let b of B.filter(x=>x.st=='out')){let p=path(b.t);ball(c,p.x,p.y,b.n,20,idx==6,1)}for(let i=0;i<S.length;i++)ball(c,95+i*72,475,S[i],25,i==6,1);c.fillStyle='#fff';c.font='900 24px sans-serif';c.fillText(`제 ${next}회`,32,42)}function drawZ(t){let c=zc,w=700,h=560;c.clearRect(0,0,w,h);c.fillStyle='#ffffff0d';c.fillRect(0,0,w,h);let x=350,y=265;c.strokeStyle='#ffffff55';c.lineWidth=18;c.beginPath();c.arc(x,y,168,3.08,.06,true);c.stroke();c.lineWidth=38;c.strokeStyle='#ffffff2a';c.beginPath();c.arc(x,y,168,0,3.14);c.stroke();for(let i=0;i<14;i++){let a=t*.0045+i*.45;ball(c,x+Math.cos(a)*120,y+Math.sin(a)*44+18,(i*3)%45+1,24)}c.fillStyle='#ffffff38';c.beginPath();c.moveTo(x-58,36);c.lineTo(x+58,36);c.lineTo(x+40,175);c.quadraticCurveTo(x,204,x-40,175);c.closePath();c.fill();let e=B.find(b=>b.st=='out'),n=T[Math.min(S.length,6)];if(e)ball(c,x,157,e.n,32,idx==6,1);else if(n)ball(c,x,157,n,32,S.length>=6,phase=='susp');c.fillStyle='#fff';c.font='900 26px sans-serif';c.textAlign='center';c.fillText(phase=='susp'?'배출 직전':phase=='done'?'추첨 완료':'배출구 확대',x,505)}function drawR(){let c=rc,w=1400,h=470;c.clearRect(0,0,w,h);c.fillStyle='#ffffff0d';c.fillRect(0,0,w,h);c.strokeStyle='#e8f8ffee';c.lineWidth=16;c.lineCap='round';c.beginPath();c.moveTo(300,66);c.bezierCurveTo(485,78,825,72,1050,84);c.bezierCurveTo(1132,89,1180,96,1254,128);c.stroke();c.lineWidth=12;c.beginPath();c.moveTo(245,208);c.lineTo(1190,208);c.stroke();let P=[258,370,482,594,706,818,1038];for(let i=0;i<S.length;i++)ball(c,P[i],222,S[i],35,i==6,1);let e=B.find(b=>b.st=='out');if(e){let q=e.t,x,y;if(q<.54){let p=q/.54;x=332+p*846;y=76+Math.sin(p*3.14)*12}else{let p=(q-.54)/.46;x=1178-p*140;y=128+p*94}ball(c,x,y,e.n,31,idx==6,1)}c.fillStyle='#fff';c.font='900 28px sans-serif';c.fillText('당첨 공',60,224);c.font='900 24px sans-serif';c.fillText(`제 ${next}회`,60,64)}random.onclick=()=>begin('random');stat.onclick=()=>begin('stat');reset.onclick=resetAll;make();load();resetAll();requestAnimationFrame(loop)</script></body></html>

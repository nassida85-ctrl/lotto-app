<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#08131f"><title>로또 6/45 예상 시뮬레이션</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:radial-gradient(circle at top,#184b70,#0a1c2c 46%,#050b12);color:#f5fbff}.wrap{max-width:780px;margin:auto;padding:18px 14px 36px}.head{text-align:center;margin-bottom:14px}h1{margin:0;font-size:28px}.round{margin-top:8px;font-size:16px;font-weight:900;color:#d8efff}.date{margin-top:4px;font-size:13px;color:#a9c8db}.stage{background:linear-gradient(180deg,#17658f,#10445f 55%,#0b2b40);border:2px solid #ffffff22;border-radius:22px;padding:12px;box-shadow:0 14px 28px #0006}.panel{overflow:hidden;border:2px solid #ffffff22;border-radius:18px;min-height:390px;background:linear-gradient(#ffffff14,#ffffff06)}canvas{display:block;width:100%;height:100%}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}button{width:100%;border:0;border-radius:14px;padding:15px 8px;font-size:15px;font-weight:900;color:#fff;box-shadow:0 7px 16px #0005;cursor:pointer}.weekly{background:linear-gradient(#19c68a,#0c8f68)}.stat{background:linear-gradient(#34d2ff,#0d9fe2)}.unpopular{background:linear-gradient(#7558e8,#4a32b7)}.games{display:grid;gap:10px;margin-top:14px}.game{background:#ffffff12;border:1px solid #ffffff1f;border-radius:15px;padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.glabel{min-width:54px;font-size:14px;font-weight:900;color:#d9efff}.nums{display:flex;gap:7px;flex-wrap:wrap}.ball{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;box-shadow:0 5px 11px #0004}.b1{background:#f7cb45;color:#111}.b2{background:#55b8ff;color:#111}.b3{background:#ff7070;color:#111}.b4{background:#566678;color:#fff}.b5{background:#69ca7e;color:#111}.mode{margin-top:10px;text-align:center;font-size:13px;font-weight:800;color:#d7ebf7}.note{text-align:center;color:#9ebdce;font-size:12px;margin-top:12px;line-height:1.55}@media(max-width:650px){h1{font-size:24px}.panel{min-height:320px}.ball{width:40px;height:40px;font-size:17px}.buttons{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><h1>로또 6/45 예상 시뮬레이션</h1><div class="round" id="roundText">제 ?회차 예상</div><div class="date" id="dateText">추첨일 계산 중</div></div><div class="stage"><div class="panel"><canvas id="machine" width="1000" height="600"></canvas></div><div class="buttons"><button id="weeklyBtn" class="weekly">이번주 추천 5게임</button><button id="statBtn" class="stat">통계추천 5게임</button><button id="unpopularBtn" class="unpopular">비인기추천 5게임</button></div><div class="mode" id="modeText">공은 원통 안에서 계속 회전합니다.</div><div class="games" id="games"></div></div><div class="note">이번주 추천은 최근 흐름과 조합 균형, 통계추천은 과거 출현·미출현 가중, 비인기추천은 공동당첨 회피 성향을 반영합니다.</div></div><script>const DATA_URL='https://smok95.github.io/lotto/results/all.json',canvas=document.getElementById('machine'),ctx=canvas.getContext('2d'),gamesEl=document.getElementById('games');let draws=[],balls=[];function c(n){return n<=10?'#f7cb45':n<=20?'#55b8ff':n<=30?'#ff7070':n<=40?'#566678':'#69ca7e'}function tc(n){return n>=31&&n<=40?'#fff':'#111'}function cl(n){return n<=10?'b1':n<=20?'b2':n<=30?'b3':n<=40?'b4':'b5'}function r(a,b){return Math.random()*(b-a)+a}function pd(s){if(!s)return null;const d=new Date(s+'T00:00:00+09:00');return isNaN(d)?null:d}function fd(d){return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} 토`}function ns(from=new Date()){const d=new Date(from);d.setHours(0,0,0,0);let a=(6-d.getDay()+7)%7;if(a===0&&from.getHours()>=21)a=7;d.setDate(d.getDate()+a);return d}function target(latest){const now=new Date(),ld=pd(latest.date);let inc=1,td;if(ld){const days=Math.max(0,Math.floor((now-ld)/86400000));inc=Math.max(1,Math.floor(days/7)+1);td=new Date(ld);td.setDate(td.getDate()+7*inc)}else td=ns(now);roundText.textContent=`제 ${latest.no+inc}회차 예상`;dateText.textContent=`${fd(td)} 추첨 예정`}async function load(){try{const q=await fetch(DATA_URL,{cache:'no-store'}),j=await q.json();draws=j.map(d=>({no:+d.draw_no,n:d.numbers.map(Number).sort((a,b)=>a-b),date:d.date||d.drwNoDate||''})).sort((a,b)=>a.no-b.no);localStorage.lottoQuick=JSON.stringify(draws);target(draws.at(-1))}catch(e){const x=localStorage.lottoQuick;if(x){draws=JSON.parse(x);target(draws.at(-1))}else{roundText.textContent='이번 주 예상';dateText.textContent=`${fd(ns())} 추첨 예정`}}}function norm(o){const v=Object.values(o),lo=Math.min(...v),hi=Math.max(...v),z={};for(const k in o)z[k]=hi===lo?.5:(o[k]-lo)/(hi-lo);return z}function ana(){if(!draws.length)return null;const latest=draws.at(-1).no,a={},r10={},r20={},r50={},r100={},last={};for(let n=1;n<=45;n++){a[n]=r10[n]=r20[n]=r50[n]=r100[n]=last[n]=0}draws.forEach(d=>d.n.forEach(n=>{a[n]++;last[n]=d.no}));draws.slice(-10).forEach(d=>d.n.forEach(n=>r10[n]++));draws.slice(-20).forEach(d=>d.n.forEach(n=>r20[n]++));draws.slice(-50).forEach(d=>d.n.forEach(n=>r50[n]++));draws.slice(-100).forEach(d=>d.n.forEach(n=>r100[n]++));const gap={};for(let n=1;n<=45;n++)gap[n]=latest-last[n];const A=norm(a),A10=norm(r10),A20=norm(r20),A50=norm(r50),A100=norm(r100),G=norm(gap),stat={},weekly={};for(let n=1;n<=45;n++){stat[n]=.12*A[n]+.18*A20[n]+.25*A50[n]+.20*A100[n]+.25*G[n];weekly[n]=.08*A[n]+.27*A10[n]+.25*A20[n]+.18*A50[n]+.22*G[n]}return{stat,weekly,lastSet:new Set(draws.at(-1).n)}}function randomGame(){let a=Array.from({length:45},(_,i)=>i+1);for(let i=44;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,6).sort((a,b)=>a-b)}function wg(score){let items=Array.from({length:45},(_,i)=>i+1),out=[];for(let k=0;k<6;k++){const w=items.map(n=>.30+score[n]),tot=w.reduce((a,b)=>a+b,0);let q=Math.random()*tot,acc=0,idx=0;for(let i=0;i<items.length;i++){acc+=w[i];if(acc>=q){idx=i;break}}out.push(items.splice(idx,1)[0])}return out.sort((a,b)=>a-b)}function statGame(){const a=ana();return a?wg(a.stat):randomGame()}function ws(g,a){let s=g.reduce((x,n)=>x+a.weekly[n],0),odd=g.filter(n=>n%2).length,low=g.filter(n=>n<=22).length,sum=g.reduce((x,y)=>x+y,0),dec=new Set(g.map(n=>Math.floor((n-1)/10))).size,ov=g.filter(n=>a.lastSet.has(n)).length,con=0;for(let i=1;i<6;i++)if(g[i]===g[i-1]+1)con++;if(odd>=2&&odd<=4)s+=1;if(low>=2&&low<=4)s+=.8;if(sum>=115&&sum<=190)s+=.8;if(dec>=4)s+=.7;if(con<=1)s+=.4;else s-=con;if(ov<=2)s+=.4;else s-=ov*.5;return s}function weeklyGame(){const a=ana();if(!a)return randomGame();let best=null,bs=-1e9;for(let i=0;i<1200;i++){const g=wg(a.weekly),s=ws(g,a)+Math.random()*.3;if(s>bs){bs=s;best=g}}return best}const fav=new Set([1,3,7,8,9,10,11,12,13,14,17,21,23,25,27,28,30,31]);function up(g){let p=0,u=g.filter(n=>n<=31).length;p+=Math.max(0,u-3)*5;for(const n of g)if(fav.has(n))p+=1.2;let con=0;for(let i=1;i<6;i++)if(g[i]===g[i-1]+1)con++;p+=con*4;const d=new Set(g.map(n=>Math.floor((n-1)/10))).size;if(d<4)p+=4;return p+Math.random()*1.5}function unpopularGame(){let b=null,bp=1e9;for(let i=0;i<1800;i++){const g=randomGame(),p=up(g);if(p<bp){bp=p;b=g}}return b}function render(type){const maker=type==='weekly'?weeklyGame:type==='stat'?statGame:unpopularGame,sets=[],seen=new Set();while(sets.length<5){const g=maker(),k=g.join(',');if(!seen.has(k)){seen.add(k);sets.push(g)}}gamesEl.innerHTML=sets.map((g,i)=>`<div class="game"><div class="glabel">${i+1}게임</div><div class="nums">${g.map(n=>`<span class="ball ${cl(n)}">${n}</span>`).join('')}</div></div>`).join('');modeText.textContent=type==='weekly'?'이번주 추천 5게임':type==='stat'?'통계추천 5게임':'비인기추천 5게임'}function make(){balls=[];for(let n=1;n<=45;n++)balls.push({n,a:r(0,Math.PI*2),o:r(18,185),v:r(.008,.022),p:r(0,Math.PI*2)})}function db(x,y,n,z){ctx.save();ctx.fillStyle=c(n);ctx.beginPath();ctx.arc(x,y,z,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff55';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=tc(n);ctx.font=`900 ${Math.round(z*.88)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n,x,y+1);ctx.restore()}function frame(){const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2+4,rx=330,ry=220;ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#ffffff20');bg.addColorStop(1,'#ffffff08');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.save();ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.clip();for(const b of balls){b.a+=b.v;db(cx+Math.cos(b.a)*b.o,cy+Math.sin(b.a*1.15+b.p)*(b.o*.58)+Math.sin(b.a*2.6)*7,b.n,18)}ctx.restore();ctx.strokeStyle='#ffffff60';ctx.lineWidth=6;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();requestAnimationFrame(frame)}weeklyBtn.onclick=()=>render('weekly');statBtn.onclick=()=>render('stat');unpopularBtn.onclick=()=>render('unpopular');make();load();requestAnimationFrame(frame);</script></body></html>
